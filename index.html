<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>수능 D-Day 계산기</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <p class="eyebrow">대학수학능력시험</p>
      <h1>수능 D-Day 계산기</h1>
      <div id="user-bar" class="user-bar" hidden>
        <span><strong id="user-name"></strong>님, 오늘도 화이팅!</span>
        <button id="logout-btn" type="button" class="text-btn small">로그아웃</button>
      </div>
    </header>

    <section id="auth-screen" class="card auth-card">
      <div class="tabs" role="tablist">
        <button id="tab-login" type="button" role="tab" class="tab active" aria-selected="true">로그인</button>
        <button id="tab-signup" type="button" role="tab" class="tab" aria-selected="false">회원가입</button>
      </div>
      <form id="auth-form" novalidate>
        <label class="field">
          <span>아이디</span>
          <input id="auth-id" type="text" autocomplete="username" maxlength="20" placeholder="영문·숫자 3~20자">
        </label>
        <label class="field">
          <span>비밀번호</span>
          <input id="auth-password" type="password" autocomplete="current-password" placeholder="4자 이상">
        </label>
        <label id="confirm-field" class="field" hidden>
          <span>비밀번호 확인</span>
          <input id="auth-password-confirm" type="password" autocomplete="new-password">
        </label>
        <p id="auth-error" class="error" role="alert"></p>
        <button id="auth-submit" type="submit" class="primary-btn">로그인</button>
      </form>
      <p class="hint">계정과 설정은 이 브라우저에만 저장됩니다. 다른 기기에서는 다시 가입해야 해요.</p>
    </section>

    <div id="app-content" hidden>
    <section class="card main-card" aria-live="polite">
      <div class="exam-meta">
        <span id="exam-label">2028학년도 수능</span>
        <span id="exam-badge" class="badge">예상</span>
      </div>
      <p id="dday" class="dday">D-0</p>
      <p id="exam-date" class="exam-date"></p>
      <p id="dday-message" class="message"></p>

      <div class="countdown" aria-label="시험 시작까지 남은 시간">
        <div><span id="cd-days">0</span><small>일</small></div>
        <div><span id="cd-hours">00</span><small>시간</small></div>
        <div><span id="cd-minutes">00</span><small>분</small></div>
        <div><span id="cd-seconds">00</span><small>초</small></div>
      </div>
      <p class="hint">1교시 시작(오전 8시 40분) 기준</p>
    </section>

    <section class="card">
      <h2>남은 기간 한눈에 보기</h2>
      <div class="stat-grid">
        <div><span id="stat-weeks" class="stat-value">0주</span><span class="stat-label">남은 주</span></div>
        <div><span id="stat-weekends" class="stat-value">0번</span><span class="stat-label">남은 주말</span></div>
        <div><span id="stat-months" class="stat-value">0개월</span><span class="stat-label">남은 개월</span></div>
      </div>
      <div class="progress-head">
        <span>지난 수능 이후 진행률</span>
        <span id="progress-text">0%</span>
      </div>
      <div class="progress-bar"><div id="progress-fill"></div></div>
    </section>

    <section class="card">
      <h2>목표 시험 선택</h2>
      <label class="field">
        <span>수능 학년도</span>
        <select id="exam-select"></select>
      </label>
      <label class="field">
        <span>날짜 직접 입력 (모의고사·목표일 등)</span>
        <div class="field-row">
          <input id="custom-date" type="date">
          <button id="clear-custom" type="button" class="text-btn">지우기</button>
        </div>
      </label>
      <p class="hint">'예상' 표시된 날짜는 교육부 공식 발표 전 추정일입니다. 발표 후 날짜가 다르면 직접 입력해 주세요.</p>
    </section>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
